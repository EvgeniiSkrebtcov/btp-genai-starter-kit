[tool.poetry]
name = "simple-rag"
version = "0.1.0"
description = "Simple RAG implementation using HANA Cloud Vector Store"
authors = ["EvgeniiSkrebtcov"]
readme = "README.md"
packages = [{ include = "library" }]

[tool.poetry.dependencies]
generative-ai-hub-sdk = {extras = ["all"], version = "^4.12.4"}
gitpython = "^3.1.43"
python = ">=3.10,<3.13"
python-dotenv = "^1.0.1"
utils = { path = "../utils", develop = true }
langchain-hana = "^0.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
